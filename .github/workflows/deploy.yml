name: Deploy SportsPie

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check palette.js
          node --check daily.js
          node --check hints.js
      - name: Verify logo-pixel calculations
        run: node --test tests/palette.test.cjs tests/daily.test.cjs tests/hints.test.cjs
      - name: Build and verify all team logos
        run: node scripts/build-assets.mjs
      - name: Verify compiled FBS catalog
        run: node tests/team-catalog.test.cjs
      - name: Configure and enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
